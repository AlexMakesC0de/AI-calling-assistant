<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Notifications</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .controls button:hover {
            background: #5568d3;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: white;
        }

        .auto-refresh input {
            accent-color: white;
            cursor: pointer;
        }

        .notifications {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .notification {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #ccc;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification.service {
            border-left-color: #ff6b6b;
            background: #fff5f5;
        }

        .notification.non-service {
            border-left-color: #51cf66;
            background: #f1fce4;
        }

        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .notification-type {
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .notification.service .notification-type {
            background: #ff6b6b;
            color: white;
        }

        .notification.non-service .notification-type {
            background: #51cf66;
            color: white;
        }

        .notification-time {
            color: #999;
            font-size: 12px;
        }

        .notification-title {
            margin: 10px 0;
        }

        .notification-title strong {
            display: block;
            color: #333;
            font-size: 16px;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .notification-sender {
            color: #666;
            font-size: 13px;
        }

        .notification-content {
            background: rgba(0, 0, 0, 0.02);
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            border-left: 3px solid #667eea;
        }

        .notification-content p {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .notification-reason {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            font-style: italic;
        }

        .empty-state {
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            text-align: center;
            color: #999;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .badge.service {
            background: #ff6b6b;
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 22px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .auto-refresh {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Notifications Dashboard</h1>
            <p>Real-time monitoring of incoming emails with service-related classification</p>

            <div class="controls">
                <div style="display: flex; gap: 10px;">
                    <button onclick="refreshNotifications()">↻ Refresh Now</button>
                    <button onclick="clearNotifications()">🗑️ Clear All</button>
                </div>
                <label class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" checked onchange="toggleAutoRefresh()">
                    Auto-refresh (5s)
                </label>
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalCount">0</div>
                    <div class="label">Total Notifications</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="serviceCount">0</div>
                    <div class="label">🔴 Service Alerts</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="nonServiceCount">0</div>
                    <div class="label">✓ Regular Emails</div>
                </div>
            </div>
        </div>

        <div class="notifications" id="notificationsContainer">
            <div class="empty-state">
                <h2>No notifications yet</h2>
                <p>Notifications will appear here when emails are received</p>
            </div>
        </div>
    </div>

    <script>
        let autoRefreshEnabled = true;
        let autoRefreshInterval = null;

        async function refreshNotifications() {
            try {
                const response = await fetch('/email-notifications');
                const data = await response.json();
                displayNotifications(data.notifications || []);
            } catch (error) {
                console.error('Failed to fetch notifications:', error);
            }
        }

        function displayNotifications(notifications) {
            const container = document.getElementById('notificationsContainer');
            
            // Update stats
            const serviceCount = notifications.filter(n => n.type === 'service').length;
            const nonServiceCount = notifications.filter(n => n.type === 'non_service').length;
            
            document.getElementById('totalCount').textContent = notifications.length;
            document.getElementById('serviceCount').textContent = serviceCount;
            document.getElementById('nonServiceCount').textContent = nonServiceCount;

            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No notifications yet</h2>
                        <p>Notifications will appear here when emails are received</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = notifications.map(notif => {
                const isService = notif.type === 'service';
                const timeStr = new Date(notif.timestamp).toLocaleString();
                const typeLabel = isService ? '🔴 SERVICE ALERT!' : '✓ Regular Email';

                return `
                    <div class="notification ${notif.type}">
                        <div class="notification-header">
                            <span class="notification-type">${typeLabel}</span>
                            <span class="notification-time">${timeStr}</span>
                        </div>
                        <div class="notification-title">
                            <strong>${escapeHtml(notif.subject)}</strong>
                            <div class="notification-sender">From: ${escapeHtml(notif.sender)}</div>
                        </div>
                        <div class="notification-content">
                            <p>${escapeHtml(notif.body_preview || 'No preview available')}</p>
                        </div>
                        ${notif.reason ? `<div class="notification-reason">Classification: ${escapeHtml(notif.reason)}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function clearNotifications() {
            if (!confirm('Clear all notifications?')) return;
            try {
                await fetch('/email-notifications/clear', { method: 'POST' });
                refreshNotifications();
            } catch (error) {
                console.error('Failed to clear notifications:', error);
            }
        }

        function toggleAutoRefresh() {
            autoRefreshEnabled = document.getElementById('autoRefresh').checked;
            if (autoRefreshEnabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            autoRefreshInterval = setInterval(refreshNotifications, 5000);
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // Initial load and auto-refresh setup
        refreshNotifications();
        startAutoRefresh();

        // Cleanup on page unload
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>
</html>
