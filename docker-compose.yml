###############################################################################
# Customer Support Call Transcription & Reporting System
# docker-compose.yml – local-first, all services on a shared bridge network
###############################################################################

x-common: &common
  restart: unless-stopped
  networks:
    - app-network

services:
  # -----------------------------------------------------------------------
  # 0. Ollama – local LLM runtime (containerized)
  # -----------------------------------------------------------------------
  ollama:
    <<: *common
    image: ollama/ollama:latest
    container_name: support-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ./local-storage/ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # -----------------------------------------------------------------------
  # 1. Database – PostgreSQL 16 (persists n8n data + issue log)
  # -----------------------------------------------------------------------
  database:
    <<: *common
    image: pgvector/pgvector:pg16
    container_name: support-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_secret}
      POSTGRES_DB: ${POSTGRES_DB:-support_db}
      POSTGRES_N8N_USER: ${POSTGRES_N8N_USER:-n8n_user}
      POSTGRES_N8N_PASSWORD: ${POSTGRES_N8N_PASSWORD:-n8n}
      POSTGRES_N8N_DB: ${POSTGRES_N8N_DB:-n8n_db}
    ports:
      - "5432:5432"
    volumes:
      - ./local-storage/postgres-data:/var/lib/postgresql/data
      - ./database/initDb:/docker-entrypoint-initdb.d
      - ./local-storage/bucket:/bucket
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    networks:
      - app-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${ADMINPASSWORD:-admin123}
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./database/initDb/servers.json:/pgadmin4/servers.json:ro


  # -----------------------------------------------------------------------
  # 2. Orchestrator – n8n (workflow automation)
  # -----------------------------------------------------------------------
  n8n:
    <<: *common
    image: n8nio/n8n:latest
    container_name: support-n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: database
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_N8N_DB:-n8n_db}
      DB_POSTGRESDB_USER: ${POSTGRES_N8N_USER:-n8n_user}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_N8N_PASSWORD:-n8n}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin}
      GENERIC_TIMEZONE: ${TZ:-Europe/Amsterdam}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    volumes:
      - ./local-storage/n8n-data:/home/node/.n8n
      - ./local-storage/shared:/data/shared
    depends_on:
      database:
        condition: service_healthy
      voice-app:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 3. Voice Recording App – the main entry point
  #    Accepts audio uploads and runs the full pipeline automatically:
  #    transcribe → AI form fill → email support team
  # -----------------------------------------------------------------------
  voice-app:
    build:
      context: ./voice-app
      dockerfile: Dockerfile
    container_name: support-voice-app
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "5000:5000"
    environment:
      UPLOAD_DIR: /data/shared/uploads
      TRANSCRIBER_URL: ${TRANSCRIBER_URL:-http://transcriber:9000/transcribe}
      FORMATTER_URL: ${FORMATTER_URL:-http://transcript-formatter:5001/format}
      FORMATTER_TIMEOUT_SECONDS: ${FORMATTER_TIMEOUT_SECONDS:-360}
      EMAIL_URL: ${EMAIL_URL:-http://email-sender:5002/send}
      
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-support-team@example.com}"
      PROFANITY_FILTER: "${PROFANITY_FILTER:-true}"
      PROFANITY_CENSOR_CHAR: "${PROFANITY_CENSOR_CHAR:-*}"

      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-support_db}
      DB_USER: ${POSTGRES_USER:-support}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-support_secret}
      DB_SAVE_WAIT_SECONDS: ${DB_SAVE_WAIT_SECONDS:-8}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-3}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-120}
      CLASSIFIER_UNCLEAR_THRESHOLD: ${CLASSIFIER_UNCLEAR_THRESHOLD:-0.55}
    volumes:
      - ./local-storage/shared:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      transcriber:
        condition: service_healthy
      transcript-formatter:
        condition: service_healthy
      email-sender:
        condition: service_healthy
      ollama:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 4. Telephony Ingest – receives PBX/provider recording events
  #    and forwards audio into the existing voice-app /upload pipeline.
  # -----------------------------------------------------------------------
  telephony-ingest:
    restart: unless-stopped
    build:
      context: ./telephony-ingest
      dockerfile: Dockerfile
    container_name: support-telephony-ingest
    networks:
      - app-network
    ports:
      - "5010:5010"
    environment:
      VOICE_APP_UPLOAD_URL: ${VOICE_APP_UPLOAD_URL:-http://voice-app:5000/upload}
      TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
      TELEPHONY_EVENTS_DIR: /data/shared/telephony-events
      TELEPHONY_TMP_DIR: /tmp/telephony
      RECORDING_DOWNLOAD_TIMEOUT: ${RECORDING_DOWNLOAD_TIMEOUT:-120}
      VOICE_APP_FORWARD_TIMEOUT: ${VOICE_APP_FORWARD_TIMEOUT:-900}
      RECORDING_AUTH_HEADER: ${RECORDING_AUTH_HEADER:-}
      RECORDING_AUTH_VALUE: ${RECORDING_AUTH_VALUE:-}
    volumes:
      - ./local-storage/shared:/data/shared
      - pbx_recordings:/data/pbx-recordings:ro
    depends_on:
      voice-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5010/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # 4b. WhatsApp Ingest – Twilio WhatsApp webhook adapter (prototype).
  #     Receives inbound messages/media/voice-notes, forwards audio into
  #     the voice-app /upload pipeline, and exposes /send for replies.
  # -----------------------------------------------------------------------
  whatsapp-ingest:
    restart: unless-stopped
    build:
      context: ./whatsapp-ingest
      dockerfile: Dockerfile
    container_name: support-whatsapp-ingest
    networks:
      - app-network
    ports:
      - "5011:5011"
    environment:
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_VALIDATE_SIGNATURE: ${TWILIO_VALIDATE_SIGNATURE:-true}
      WHATSAPP_PUBLIC_BASE_URL: ${WHATSAPP_PUBLIC_BASE_URL:-}
      WHATSAPP_AUTO_ACK_TEXT: ${WHATSAPP_AUTO_ACK_TEXT:-Got it — processing your message.}
      WHATSAPP_AUTO_ACK_VOICE: ${WHATSAPP_AUTO_ACK_VOICE:-Got your voice note — transcribing now.}
      WHATSAPP_SILENT_REPLY: ${WHATSAPP_SILENT_REPLY:-false}
      VOICE_APP_UPLOAD_URL: ${VOICE_APP_UPLOAD_URL:-http://voice-app:5000/upload}
      VOICE_APP_FORWARD_TIMEOUT: ${VOICE_APP_FORWARD_TIMEOUT:-900}
      MEDIA_DOWNLOAD_TIMEOUT: ${MEDIA_DOWNLOAD_TIMEOUT:-120}
      WHATSAPP_EVENTS_DIR: /data/shared/whatsapp-events
      WHATSAPP_MEDIA_DIR: /data/shared/whatsapp-media
      WHATSAPP_TMP_DIR: /tmp/whatsapp
      DATABASE_URL: postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support_secret}@database:5432/${POSTGRES_DB:-support_db}
    volumes:
      - ./local-storage/shared:/data/shared
    depends_on:
      voice-app:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5011/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # 5. Transcriber – Whisper STT + Speaker Diarization
  #    Uses faster-whisper for word-level timestamps and speechbrain
  #    ECAPA-TDNN embeddings with spectral clustering for diarization.
  # -----------------------------------------------------------------------
  transcriber:
    <<: *common
    build:
      context: ./transcriber
      dockerfile: Dockerfile
    container_name: support-transcriber
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      NUM_SPEAKERS: ${NUM_SPEAKERS:-2}
    ports:
      - "9000:9000"
    volumes:
      - ./local-storage/shared:/data/shared
      - ./local-storage/whisper-models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # -----------------------------------------------------------------------
  # 6. Transcript Formatter – custom Flask API (raw text → report JSON)
  # -----------------------------------------------------------------------
  transcript-formatter:
    build:
      context: ./transcript-formatter
      dockerfile: Dockerfile
    container_name: support-transcript-formatter
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "5001:5001"
    environment:
      TEMPLATE_DIR: /data/shared/templates
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-3}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-180}
      OLLAMA_TRANSLATE_READ_TIMEOUT: ${OLLAMA_TRANSLATE_READ_TIMEOUT:-180}
      OLLAMA_PULL_TIMEOUT: ${OLLAMA_PULL_TIMEOUT:-900}
      TRANSLATION_CHUNK_MAX_CHARS: ${TRANSLATION_CHUNK_MAX_CHARS:-2500}
      DEFAULT_INCLUDE_DUTCH_TRANSLATION: ${DEFAULT_INCLUDE_DUTCH_TRANSLATION:-true}
      TERM_FILTER_MODE: ${TERM_FILTER_MODE:-basic}
      TERM_FILTER_CUSTOM_WORDS: ${TERM_FILTER_CUSTOM_WORDS:-}
      TERM_FILTER_REPLACEMENT: ${TERM_FILTER_REPLACEMENT:-[redacted]}
    volumes:
      - ./local-storage/shared:/data/shared
      - ./templates:/data/shared/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      ollama:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 7. Email Sender – lightweight Python SMTP service
  # -----------------------------------------------------------------------
  email-sender:
    <<: *common
    build:
      context: ./email-sender
      dockerfile: Dockerfile
    container_name: support-email-sender
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-support@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "5002:5002"
    volumes:
      - ./local-storage/shared:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # 8. Dashboard – Next.js UI for the full pipeline: upload audio, browse
  #    incident forms, view multilingual transcripts, and read the Mailpit
  #    inbox. Shares `support-db` with the Python services.
  # -----------------------------------------------------------------------
  dashboard:
    <<: *common
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: support-dashboard
    environment:
      # In-network DSN — overrides the host-mode default in dashboard/.env.example
      DATABASE_URL: postgresql://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support_secret}@database:5432/${POSTGRES_DB:-support_db}
      VOICE_APP_UPLOAD_URL: ${VOICE_APP_UPLOAD_URL_DASHBOARD:-http://voice-app:5000/upload}
      MAILPIT_URL: ${MAILPIT_URL_DASHBOARD:-http://mailpit:8025}
      OLLAMA_URL: ${OLLAMA_URL_DASHBOARD:-http://ollama:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OUTLOOK_TENANT_ID: ${OUTLOOK_TENANT_ID:-}
      OUTLOOK_CLIENT_ID: ${OUTLOOK_CLIENT_ID:-}
      OUTLOOK_CLIENT_SECRET: ${OUTLOOK_CLIENT_SECRET:-}
      OUTLOOK_MAILBOX: ${OUTLOOK_MAILBOX:-}
      OUTLOOK_FOLDER: ${OUTLOOK_FOLDER:-Inbox}
      EMAIL_ATTACHMENTS_DIR: /data/shared/email-attachments
      WHATSAPP_MEDIA_DIR: /data/shared/whatsapp-media
      OUTLOOK_ATTACHMENTS_DIR: /data/shared/outlook-attachments
      NODE_ENV: production
    volumes:
      - ./local-storage/shared:/data/shared
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      # BusyBox wget ships in node:22-alpine — Next's root route returns 200
      # once the server has bound and Prisma has connected.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------------------
  # 9. Email Monitor – monitors Outlook inbox and classifies emails
  #    Sends real-time notifications to dashboard
  # -----------------------------------------------------------------------
  email-monitor:
    <<: *common
    build:
      context: ./email-monitor
      dockerfile: Dockerfile
    container_name: support-email-monitor
    env_file:
      - .env
    environment:
      OUTLOOK_EMAIL: ${OUTLOOK_EMAIL:-fjodor.smorodins@student.nhlstenden.com}
      OUTLOOK_PASSWORD: ${OUTLOOK_PASSWORD:-changeme}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-3}
      OLLAMA_READ_TIMEOUT: ${OLLAMA_READ_TIMEOUT:-120}
      VOICE_APP_URL: ${VOICE_APP_URL:-http://voice-app:5000}
      PROCESSED_EMAILS_STORE: /storage/processed_message_ids.json
      SUPPORT_INBOX_ADDRESSES: ${SUPPORT_INBOX_ADDRESSES:-}
      GRAPH_MAILBOX: ${GRAPH_MAILBOX:-}
    ports:
      - "5003:5003"
    volumes:
      - ./attachments:/storage/uploads
      - ./local-storage/email-monitor:/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      ollama:
        condition: service_healthy
      voice-app:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 9. Mailpit – local SMTP catch-all with web UI (dev/test only)
  # -----------------------------------------------------------------------
  mailpit:
    <<: *common
    image: axllent/mailpit:latest
    container_name: support-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/api/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - dev

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge

volumes:
  pgadmin-data:
  pbx_recordings:
    name: pbx_recordings
