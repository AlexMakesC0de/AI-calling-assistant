###############################################################################
# Customer Support Call Transcription & Reporting System
# docker-compose.yml – local-first, all services on a shared bridge network
###############################################################################

x-common: &common
  restart: unless-stopped
  networks:
    - app-network

services:
  # -----------------------------------------------------------------------
  # 1. Database – PostgreSQL 16 (persists n8n data + issue log)
  # -----------------------------------------------------------------------
  database:
    <<: *common
    image: pgvector/pgvector:pg16
    container_name: support-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_secret}
      POSTGRES_DB: ${POSTGRES_DB:-support_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/initDb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  pgAdmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${ADMINPASSWORD:-admin123}
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin


  # -----------------------------------------------------------------------
  # 2. Orchestrator – n8n (workflow automation)
  # -----------------------------------------------------------------------
  n8n:
    <<: *common
    image: n8nio/n8n:latest
    container_name: support-n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: database
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-support_db}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-support}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-support_secret}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin}
      GENERIC_TIMEZONE: ${TZ:-Europe/Amsterdam}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - shared_data:/data/shared
    depends_on:
      database:
        condition: service_healthy
      voice-app:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 3. Voice Recording App – the main entry point
  #    Accepts audio uploads and runs the full pipeline automatically:
  #    transcribe → AI form fill → email support team
  # -----------------------------------------------------------------------
  voice-app:
    build:
      context: ./voice-app
      dockerfile: Dockerfile
    container_name: support-voice-app
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "5000:5000"
    environment:
      UPLOAD_DIR: /data/shared/uploads
      WHISPER_URL: http://whisper:9000/asr
      FORMATTER_URL: http://transcript-formatter:5001/format
      EMAIL_URL: http://email-sender:5002/send
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support-team@example.com}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-support_db}
      DB_USER: ${POSTGRES_USER:-support}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-support_secret}
    volumes:
      - shared_data:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      whisper:
        condition: service_healthy
      email-sender:
        condition: service_healthy

  # -----------------------------------------------------------------------
  # 4. STT Engine – Whisper ASR web service (speech-to-text)
  # -----------------------------------------------------------------------
  whisper:
    <<: *common
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: support-whisper
    environment:
      ASR_MODEL: small
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    volumes:
      - shared_data:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # -----------------------------------------------------------------------
  # 5. Transcript Formatter – custom Flask API (raw text → report JSON)
  #    Uses network_mode: host to access the local Ollama LLM on localhost
  # -----------------------------------------------------------------------
  transcript-formatter:
    build:
      context: ./transcript-formatter
      dockerfile: Dockerfile
    container_name: support-transcript-formatter
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "5001:5001"
    environment:
      TEMPLATE_DIR: /data/shared/templates
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - shared_data:/data/shared
      - ./templates:/data/shared/templates:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # 6. Email Sender – lightweight Python SMTP service
  # -----------------------------------------------------------------------
  email-sender:
    <<: *common
    build:
      context: ./email-sender
      dockerfile: Dockerfile
    container_name: support-email-sender
    environment:
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-support@example.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "5002:5002"
    volumes:
      - shared_data:/data/shared
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -----------------------------------------------------------------------
  # 7. Mailpit – local SMTP catch-all with web UI (dev/test only)
  # -----------------------------------------------------------------------
  mailpit:
    <<: *common
    image: axllent/mailpit:latest
    container_name: support-mailpit
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/api/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    profiles:
      - dev

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  pg_data:
    driver: local
  n8n_data:
    driver: local
  shared_data:
    driver: local

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  app-network:
    driver: bridge
