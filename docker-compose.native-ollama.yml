# Opt-in overlay: use the host's native GPU Ollama (Apple Metal / CUDA) instead
# of the CPU-only Docker ollama, which is slow and OOM-kills larger models on macOS.
# Additive — changes nothing in docker-compose.yml. Activate with a second -f:
#   docker compose -f docker-compose.yml -f docker-compose.native-ollama.yml up -d
# Requires the host Ollama running with OLLAMA_MODEL (and OLLAMA_EMBED_MODEL) pulled.
# Linux hosts: also add `extra_hosts: ["host.docker.internal:host-gateway"]` per service.

services:
  # Park the bundled CPU Ollama (and its init helper) behind a profile so they don't start.
  ollama:
    profiles:
      - docker-ollama
  ollama-init:
    profiles:
      - docker-ollama

  transcript-formatter:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      ollama: !reset null   # drop the wait-on-Docker-ollama dependency

  dashboard:
    environment:
      OLLAMA_URL: http://host.docker.internal:11434

  # macOS AirPlay Receiver holds port 5000; publish on 5050 instead.
  # !override replaces the base ports list (a plain list would append, keeping 5000).
  voice-app:
    ports: !override
      - "5050:5000"
