services:
  pbx-db:
    image: mariadb:10.11
    container_name: support-pbx-db
    restart: unless-stopped
    networks:
      - app-network
    environment:
      MARIADB_ROOT_PASSWORD: ${PBX_DB_ROOT_PASSWORD:-pbx_root_change_me}
      MARIADB_DATABASE: ${PBX_DB_NAME:-asterisk}
      MARIADB_USER: ${PBX_DB_USER:-asterisk}
      MARIADB_PASSWORD: ${PBX_DB_PASSWORD:-asterisk_change_me}
    volumes:
      - pbx_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${PBX_DB_ROOT_PASSWORD:-pbx_root_change_me} || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  freepbx:
    image: tiredofit/freepbx:latest
    container_name: support-freepbx
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      pbx-db:
        condition: service_healthy
    environment:
      DB_EMBEDDED: "FALSE"
      DB_HOST: pbx-db
      DB_NAME: ${PBX_DB_NAME:-asterisk}
      DB_USER: ${PBX_DB_USER:-asterisk}
      DB_PASS: ${PBX_DB_PASSWORD:-asterisk_change_me}
      RTP_START: ${PBX_RTP_START:-10000}
      RTP_FINISH: ${PBX_RTP_FINISH:-10050}
      ENABLE_FAIL2BAN: "FALSE"
      TZ: ${TZ:-Europe/Amsterdam}
    ports:
      - "${PBX_HTTP_PORT:-8088}:80"
      - "${PBX_HTTPS_PORT:-8443}:443"
      - "${PBX_SIP_PORT:-5060}:5060/udp"
      - "${PBX_PJSIP_PORT:-5160}:5160/udp"
      - "${PBX_RTP_START:-10000}-${PBX_RTP_FINISH:-10050}:${PBX_RTP_START:-10000}-${PBX_RTP_FINISH:-10050}/udp"
    volumes:
      - pbx_data:/data
      - pbx_logs:/var/log
      - pbx_recordings:/var/spool/asterisk/monitor
      - ./telephony-lab/seed/asterisk.sql:/assets/seed/asterisk.sql:ro
      - ./telephony-lab/seed/ivr-greeting.ogg:/assets/seed/ivr-greeting.ogg:ro
      - ./telephony-lab/seed/post-init-seed.sh:/assets/custom-scripts/post-init-seed.sh:ro
      - ./telephony-lab/seed/fix-ami-password.sh:/assets/custom-scripts/fix-ami-password.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20m

  # -----------------------------------------------------------------------
  # AMI Listener – watches for CDR events and forwards recordings
  # to the telephony-ingest webhook for pipeline processing.
  # -----------------------------------------------------------------------
  ami-listener:
    restart: unless-stopped
    build:
      context: ./telephony-ingest
      dockerfile: Dockerfile
    container_name: support-ami-listener
    networks:
      - app-network
    entrypoint: ["python", "-m", "ami_listener"]
    environment:
      AMI_HOST: freepbx
      AMI_PORT: "5038"
      AMI_USER: ${AMI_USER:-admin-docker}
      AMI_PASS: ${AMI_PASS:-amp111}
      WEBHOOK_URL: http://telephony-ingest:5010/webhooks/recording-complete
      TELEPHONY_WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
      RECORDING_BASE: /data/pbx-recordings
      AMI_RECONNECT_DELAY: "10"
    volumes:
      - pbx_recordings:/data/pbx-recordings:ro
    depends_on:
      freepbx:
        condition: service_healthy

networks:
  app-network:
    external: true
    name: ${COMPOSE_NETWORK:-it-2c_app-network}

volumes:
  pbx_db_data:
    driver: local
  pbx_data:
    driver: local
  pbx_logs:
    driver: local
  pbx_recordings:
    name: pbx_recordings
